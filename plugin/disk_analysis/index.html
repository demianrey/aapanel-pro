<style>
	.bg-bubbles {
		position: absolute;
		top: 0;
		left: 0;
		z-index: 99;
		overflow: hidden;
		width: 100%;
		height: 100%;
		opacity: 0.8;
	}

	.bg-bubbles li {
		position: absolute;
		bottom: -10pc;
		z-index: -1;
		width: 40px;
		height: 40px;
		background-color: rgba(32, 165, 58, 0.08);
		list-style: none;
		transition-timing-function: linear;
		animation: square 15s infinite;
	}

	.bg-bubbles li:nth-child(1) {
		left: 10%;
	}

	.bg-bubbles li:nth-child(2) {
		left: 20%;
		width: 90px;
		height: 90px;
		animation-delay: 2s;
		animation-duration: 7s;
	}

	.bg-bubbles li:nth-child(3) {
		left: 25%;
		animation-delay: 4s;
	}

	.bg-bubbles li:nth-child(4) {
		left: 40%;
		width: 60px;
		height: 60px;
		background-color: rgba(32, 165, 58, 0.02);
		animation-duration: 8s;
	}

	.bg-bubbles li:nth-child(5) {
		left: 70%;
	}

	.bg-bubbles li:nth-child(6) {
		left: 80%;
		width: 90pt;
		height: 90pt;
		background-color: rgba(32, 165, 58, 0.02);
		animation-delay: 3s;
	}

	.bg-bubbles li:nth-child(7) {
		left: 32%;
		width: 10pc;
		height: 10pc;
		animation-delay: 2s;
	}

	.bg-bubbles li:nth-child(8) {
		left: 55%;
		width: 20px;
		height: 20px;
		animation-delay: 4s;
		animation-duration: 15s;
	}

	.bg-bubbles li:nth-child(9) {
		left: 25%;
		width: 10px;
		height: 10px;
		background-color: rgba(32, 165, 58, 0.05);
		animation-delay: 2s;
		animation-duration: 12s;
	}

	.bg-bubbles li:nth-child(10) {
		left: 85%;
		width: 10pc;
		height: 10pc;
		animation-delay: 5s;
	}

	@keyframes square {
		0% {
			opacity: 0.5;
			transform: translatey(0) rotate(45deg);
		}

		25% {
			opacity: 0.75;
			transform: translatey(-400px) rotate(90deg);
		}

		50% {
			opacity: 1;
			transform: translatey(-600px) rotate(135deg);
		}

		to {
			opacity: 0;
			transform: translatey(-1000px) rotate(180deg);
		}
	}

	@-webkit-keyframes square {
		0% {
			opacity: 0.5;
			-webkit-transform: translatey(0) rotate(45deg);
		}

		25% {
			opacity: 0.75;
			-webkit-transform: translatey(-400px) rotate(90deg);
		}

		50% {
			opacity: 1;
			-webkit-transform: translatey(-600px) rotate(135deg);
		}

		to {
			opacity: 0;
			-webkit-transform: translatey(-1000px) rotate(180deg);
		}
	}

	@-webkit-keyframes removeLeft {
		0% {
			visibility: visible;
			-webkit-transform: translateX(0);
			transform: translateX(0);
		}

		to {
			-webkit-transform: translateX(-350px);
			transform: translateX(-350px);
		}
	}

	@keyframes removeLeft {
		0% {
			visibility: visible;
			-webkit-transform: translateX(0);
			transform: translateX(0);
		}

		to {
			-webkit-transform: translateX(-350px);
			transform: translateX(-350px);
		}
	}

	@-webkit-keyframes removeRight {
		0% {
			opacity: 0;
			-webkit-transform: translateX(0);
			transform: translateX(0);
		}

		to {
			opacity: 1;
			-webkit-transform: translateX(500px);
			transform: translateX(500px);
		}
	}

	@keyframes removeRight {
		0% {
			opacity: 0;
			-webkit-transform: translateX(0);
			transform: translateX(0);
		}

		to {
			opacity: 1;
			-webkit-transform: translateX(500px);
			transform: translateX(500px);
		}
	}

	@-webkit-keyframes slideInLeft {
		0% {
			visibility: visible;
			-webkit-transform: translate3d(-100%, 0, 0);
			transform: translate3d(-100%, 0, 0);
		}

		to {
			-webkit-transform: translateZ(0);
			transform: translateZ(0);
		}
	}

	@keyframes slideInLeft {
		0% {
			visibility: visible;
			-webkit-transform: translate3d(-100%, 0, 0);
			transform: translate3d(-100%, 0, 0);
		}

		to {
			-webkit-transform: translateZ(0);
			transform: translateZ(0);
		}
	}

	@-webkit-keyframes slideInRight {
		0% {
			visibility: visible;
			-webkit-transform: translate3d(100%, 0, 0);
			transform: translate3d(100%, 0, 0);
		}

		to {
			-webkit-transform: translateZ(0);
			transform: translateZ(0);
		}
	}

	@keyframes slideInRight {
		0% {
			visibility: visible;
			-webkit-transform: translate3d(100%, 0, 0);
			transform: translate3d(100%, 0, 0);
		}

		to {
			-webkit-transform: translateZ(0);
			transform: translateZ(0);
		}
	}

	@keyframes ellipsis {
		0% {
			content: '';
		}

		25% {
			content: '.';
		}

		50% {
			content: '..';
		}

		75% {
			content: '...';
		}

		100% {
			content: '';
		}
	}

	.animated {
		-webkit-animation-duration: 1s;
		animation-duration: 1s;
		-webkit-animation-fill-mode: both;
		animation-fill-mode: both;
	}

	.direction-column {
		flex-direction: column;
	}

	#DiskAnalysis {
		height: 526px;
		width: 1100px;
		position: relative;
		overflow: hidden;
		padding-bottom: 24px;
	}

	.scan-header,
	.scan-view,
	.file-view {
		position: relative;
		z-index: 999;
	}

	.file-view {
		padding: 0 24px 24px;
	}

	/* 省略动画效果 */
	.omit {
		display: inline-block;
	}

	.omit::after {
		content: '';
		animation: ellipsis 2s infinite;
	}

	/* 省略 */
	.nowrap {
		display: inline-block;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}

	/* 初始化状态 */
	.scan-header.init {
		display: flex;
		align-items: center;
		justify-content: center;
		width: 100%;
		height: 100%;
		border-radius: 4px;
	}

	/* 扫描左侧内容 */
	.scan-header .scan-left {
		height: 136px;
		width: 136px;
		position: relative;
		margin-right: 90px;
		transition: all 500ms;
		margin-left: 8px;
	}

	.scan-left .filescan-serach {
		width: 136px;
		height: 136px;
		position: absolute;
		transition: all 500ms;
	}

	.scan-left .filescan-icon {
		width: 60px;
		height: 60px;
		position: absolute;
		right: -10px;
		bottom: 0;
		transition: all 500ms;
	}

	/* 扫描右侧内容 */
	.scan-right .scan-title {
		font-size: 24px;

		color: #555;
		/* 邓 */
		margin-bottom: 14px;
		font-weight: 600;
	}

	.scan-right .scan-dir {
		margin-bottom: 16px;
	}

	.scan-right .scan-dir span {
		margin-right: 10px;
		font-size: 13px;
	}

	.scan-right .scan-dir .btlink {
		font-size: 13px;
	}

	.scan-btn button {
		/* 邓 */
		margin-right: 16px;
		font-size: 14px;
		padding: 6px 16px;
		transition: all 500ms;
	}

	.scan-btn button:last-child {
		margin-right: 8px;
	}

	.scan-btn .cancel-scan {
		display: none;
	}

	/* 启动扫描后 */
	.scan-header.scan,
	.scan-header.result {
		padding: 24px 24px 16px;
		display: flex;
	}

	.scan-header.scan .scan-left,
	.scan-header.result .scan-left {
		height: 60px;
		width: 60px;
		position: relative;
		margin-right: 40px;
		/*邓 */
		/* top:6px */
	}

	.scan-header.scan .filescan-serach,
	.scan-header.result .filescan-serach {
		height: 60px;
		width: 60px;
	}

	.scan-header.scan .filescan-icon,
	.scan-header.result .filescan-icon {
		height: 25px;
		width: 25px;
	}

	.scan-header.scan .scan-right,
	.scan-header.result .scan-right {
		display: flex;
		flex: 1;
		justify-content: space-between;
		align-items: center;
	}

	.scan-header.scan .scan-title {
		font-size: 20px;
		margin-bottom: 4px;
	}

	.scan-header.scan .scan-dir,
	.scan-header.result .scan-dir {
		display: none;
	}

	.scan-header.result .scan-title {
		font-size: 16px;
		line-height: 24px;
		/* width: 350px; */
		margin-bottom: 0;
	}

	.scan-header.result .scan-dir {
		margin-bottom: 0;
	}

	.scan-header .scan-dir {
		display: flex;
		padding-left: 2px;
	}

	.scan-header.result .scan-btn {
		display: flex;
	}

	.scan-header .scan-dir .catalogue {
		display: inline-block;
		/* max-width: 100px; */
		vertical-align: middle;
		border: 1px solid #DCDFE6;

		width: 300px;
		padding: 0px 30px 0px 8px;

		/* 邓 */
		color: #666666;
		font-size: 12px;
		line-height: 30px;
		border-radius: 2px;
	}

	.scan-header.result .scan-dir span,
	.scan-header.result .scan-dir .btlink {
		font-size: 12px;
		margin-left: 4px;
	}

	.scan-header.scan .scan-btn .scan-now,
	.scan-header.scan .scan-btn .history-scan {
		display: none;
	}

	.scan-header.scan .scan-btn .cancel-scan {
		display: block;
	}

	.scan-view {
		padding: 0 24px 24px;
	}

	.scan-view pre {
		overflow: auto;
		border: 0 none;
		line-height: 23px;
		padding: 15px;
		margin: 0;
		white-space: pre-wrap;
		background-color: #00192b;
		color: #f1f1f1;
		border-radius: 2px;
		transition: all 200ms;
	}

	/* 文件表格 */

	.filescan-nav {
		display: flex;
		justify-content: space-between;
		align-items: center;
		/* height: 61px; */
		line-height: 30px;
		/* border-top: 1px solid #efefef; */
		padding: 10px 4px;
	}

	.filescan-nav .divider {
		display: inline-block;
		height: 16px;
		line-height: 16px;
		padding: 0 8px;
		color: #bbb;
		position: relative;
		top: -1px;
	}

	.filescan-nav .filescan-nav-item {
		max-width: 120px;
		display: inline-block;
		height: 20px;
		line-height: 20px;
		/* 邓 */
		font-size: 12px;
	}

	.filescan-list {
		display: flex;
		flex-direction: column;
		flex: 1;
		color: #666666;
	}

	.file-type-icon {
		/* 邓 */
		width: 16px;
		height: 18px;
		/* 邓  end*/
		display: inline-block;
		vertical-align: middle;
		background-position: center;
		background-repeat: no-repeat;
		background-size: cover;
	}

<script type="text/javascript">
	// 构造函数：磁盘扫描
	function DiskAnalysis(config) {
		this.$el = $(config.el);
		this.diskPath = bt.get_cookie('diskPath')
		this.$bgBubbles = this.$el.find('.bg-bubbles')
		this.$scanHeader = this.$el.find('.scan-header'); // 首页的那个图片
		this.$scanTitle = this.$el.find('.scan-title'); // 首页的文字标题
		this.$scanNow = this.$el.find('.scan-now'); // 立即扫描按钮
		this.$scanAuxiliary = this.$el.find('.scan-auxiliary'); // 历史记录
		this.$cancelScan = this.$el.find('.cancel-scan'); //
		this.$scanView = this.$el.find('.scan-view'); //日志
		this.$fileView = this.$el.find('.file-view'); //磁盘列表
		this.$fileTableBody = this.$el.find('#fileScanTable .filescan-list-body'); // 文件列表
		var hrefArr = window.location.href.split('/')
		this.$scanPath = this.diskPath && (window.location.href.indexOf('/site') || hrefArr[hrefArr.length - 1] === '') ? this.diskPath : '/www/wwwroot'; // 默认扫描目录
		this.taskId = null; // 任务ID
		this.id = null; // 扫描刷新任务ID
		this.taskPath = ''; // 扫描目录
		this.cutPath = ''; // 当前目录
		this.taskStatus = false; // 扫描状态
		this.taskType = 'init'; // 扫描执行阶段
		this.taskList = {}; // 扫描缓存列表
		this.isRecycle = false; // 是否开启回收站
		this.historyList = []; // 历史记录
		this.taskCancel = false; // 是否取消扫描
		this.activeFilePath = '';
		this.ScanConfiguration = { //扫描配置
			exclude_path_list: "", //排除路径  带，字符串 在发请求时做了转换为数组
			sort: 'total_asize', //排序方式
			reverse: true, //排序时候为降序
			exts: '', //显示以下后缀的文件
			total_num: '', //显示文件数量
			show_type: '', //展示类型
			FilterSet: '',
			is_exts_exclude: null
		};
		this.TemporaryScan = { //临时扫描文件显示的配置
			total_num: '',
			exts: ''
		}
		this.Show_type = ''; //扫描展示的类型
		this.scan_id = ''; //扫描id
		this.btn = '' //判断筛选按钮的
		this.subpath = '' //子路劲
		this.overviewObj = {} // 扫描概览列表
		this.overviewObjExt = {} // 扫描概览后缀列表
		this.init();
	}

	DiskAnalysis.prototype = {
		// 初始化
		init: function () {
			var that = this;
			
			this.event();
			that.getScanAllocation()
			$('.layui-layer-page').css({
				height: '590px',
				width: '1100px',
			});
			setTimeout(function () {
				bt_tools.setLayerArea('.layui-layer-page');
			}, 100);
			if (window.location.pathname == '/files_ifame') {
				var $this = $(this);
				var $path = bt.get_cookie('files_path'); //扫描路径
				var $scanView = that.$scanView; // 日志
				var $scanHeader = that.$scanHeader; //头部
				var $scanTitle = that.$scanTitle; //首页的文字标题
				var $scanNow = that.$scanNow; //扫描按钮
				var $scanAuxiliary = that.$scanAuxiliary; //历史记录
				var $fileView = that.$fileView; //表格
				var shellView = $scanView.find('pre');
				$scanHeader.removeClass('init').addClass('scan');
				$scanAuxiliary.html('cancel scan');
				$scanView.removeClass('hide').find('pre').css({
					height: '400px',
				});
				$scanNow.hide();
				that.renderScanTitle(
					$scanTitle,
					'Scanning directory:<span class="nowrap" style="max-width:380px;vertical-align: middle;" title="' + $path +
					'">' + $path + '</span>',
					true
				);
				that.renderScanTitle(shellView, 'Creating scan job\n', true);
				that.renderScanTitle(shellView, '<span style="display:flex;" class="omit">Directory is being scanned<span>\n');
				that.taskType = 'scan';
				that.taskCancel = false;
				that.createScanTaskRequest(function (rdata) {
					if (!that.taskCancel) {
						that.taskStatus = true;
						if (!rdata.status) {
							layer.msg(rdata.msg, {
								icon: rdata.status ? 1 : 2
							})
							return $('.scan-auxiliary').trigger('click')
						};

						//邓
						that.taskId = rdata.data.scan_id;
						that.scan_id = rdata.data.scan_id
						// that.ScanConfiguration.show_type = rdata.data.show_type
						that.renderScanTitle(shellView, 'Scan is complete, waiting for the scan result to return\n');
						// 渲染扫描结果
						that.renderFilesView({
							id: that.taskId,
							path: bt.get_cookie('files_path'),
							init: true,
							show_type: rdata.data.show_type
						});
					}
				});
			} else {
				bt_tools.send({
					url: '/plugin?action=a&name=disk_analysis&s=get_last_scan_path'
				}, function (ress) {
					$('.catalogue').val(ress.data)
					that.$scanPath = ress.data
				})
			}
			// 获取回收站状态
			this.getFilesRecycleRequest(function (rdata) {
				that.isRecycle = rdata.status;
			});
		},

		// 事件处理
		event: function () {
			var that = this;

			$('.bt-sercer-scan,.bt-system-disk-scan,.scan-now').unbind('click').click(function () {
				bt.confirm({
					title:'Scanning',
					msg:'Scanning requires performance. Do you want to continue?'
				},
				function(){
					var scanType = $(this).data('type')
					var title = !scanType ? '['+that.$scanPath + '] scan Results ': $(this).text()
					that.openScan({title: title,scanType: scanType})
				}
				)
				// var scanType = $(this).data('type')
				// var title = !scanType ? '['+that.$scanPath + '] scan Results ': $(this).text()
				// that.openScan({title: title,scanType: scanType})
			})
			$('.bt-system-garbage').unbind('click').click(function () {
				that.openGarbageView()
			})

			// 立即扫描按钮
			this.bind('.scan-now1', function () {
				var type = that.taskType;
				if (type == 'init') {
					var $this = $(this);
					var $path = that.$scanPath; //扫描路径
					var $scanView = that.$scanView; // 日志
					var $scanHeader = that.$scanHeader; //头部
					var $scanTitle = that.$scanTitle; //首页的文字标题
					var $scanNow = that.$scanNow; //扫描按钮
					var $scanAuxiliary = that.$scanAuxiliary; //历史记录
					var $fileView = that.$fileView; //表格
					var shellView = $scanView.find('pre');
					$scanHeader.removeClass('init').addClass('scan');
					$scanAuxiliary.html('cancel scan');
					$scanView.removeClass('hide').find('pre').css({
						height: '400px',
					});
					$scanNow.hide();
					that.renderScanTitle(
						$scanTitle,
						'Scanning directory:<span class="nowrap" style="max-width:380px;vertical-align: middle;" title="' + $path +
						'">' + $path + '</span>',
						true
					);
					that.renderScanTitle(shellView, 'Creating scan job\n', true);
					that.renderScanTitle(shellView, '<span style="display:flex;" class="omit">Directory is being scanned<span>\n');
					that.taskType = 'scan';
					that.taskCancel = false;
					that.createScanTaskRequest(function (rdata) {
						if (!that.taskCancel) {

							that.taskStatus = true;
							if (!rdata.status) {

								layer.msg(rdata.msg, {
									icon: rdata.status ? 1 : 2
								})
								return $('.scan-auxiliary').trigger('click')
							};

							//邓
							that.taskId = rdata.data.scan_id;
							that.scan_id = rdata.data.scan_id
							that.ScanConfiguration.show_type = rdata.data.show_type
							that.renderScanTitle(shellView, 'Scan is complete, waiting for the scan result to return\n');
							// 渲染扫描结果
							that.renderFilesView({
								id: that.taskId,
								path: that.taskPath,
								init: true,
								show_type: rdata.data.show_type
							});
						}
					});
				} else {
					that.renderHistoryScan();
				}
			});
			// var hrefArr = window.location.href.split('/')
			// if (this.diskPath !== '' && (window.location.href.indexOf('/site') || hrefArr[hrefArr.length - 1] === '')) $('.scan-now').click()
			// 辅助扫描按钮，历史、取消、返回
			$('.scan-auxiliary').unbind('click').click(function () {
			// this.bind('.scan-auxiliary', function () {
				var type = that.taskType;
				switch (type) {
					case 'init':
						that.renderHistoryScan();
						break;
					case 'scan':
						that.taskStatus = false;
						that.taskCancel = true;
						that.renderInitView();
						that.getScanAllocation()
						break;
					case 'result':
						that.subpath = ''
						that.renderInitView();
						that.getScanAllocation()
						break;
				}
			});

		/**
		 * @description 渲染文件路径
		 * @param {String} path 路径
		 */
		renderFilesPath: function (path) {
			var that = this;
			var html = '';
			var newPath = '';
			var pathArr = [];
			var isLevel = false;
			var isInit = true;
			that.cutPath = path;
			pathArr = path.replace(this.taskPath.replace(/(\/\/)+/g, '/'), '').split('/');
			if (pathArr.length >= 1 && pathArr[0] !== '') pathArr.unshift('');
			if (pathArr.length > 1 && pathArr[1] !== '') {
				var upperPath = (that.getDirPath(path, false) + '/').replace(/(\/\/)+/g, '/');
				if (pathArr.length > 1) upperPath = upperPath.replace(/\/$/g, '');
				isLevel = true;
				html += '<a class="filescan-nav-item btlink return-btn cut-path" data-path="' + upperPath +
					'" title="Back">Back</a>' + '<span class="divider">|</span>';
			}
			if (pathArr.length > 3) isInit = true;
			for (var i = 0; i < pathArr.length; i++) {
				var element = pathArr[i];
				newPath += '/' + element;
				if (element === '' && i > 0) continue;
				if (i > 1 && i < pathArr.length - 1 && pathArr.length > 2) {
					if (isInit) html += '<a class="filescan-nav-item" title="Some directories have been omitted">...</a><span class="divider">></span>';
					isInit = false;
				} else {
					var isLast = pathArr.length - 1 === i;
					var isFirst = i === 0;
					var currentPath = isFirst ? that.taskPath : that.taskPath + newPath;
					var divider = !isLast ? '<span class="divider">></span>' : '';
					var menuPath = isFirst ? 'Current directory(' + that.taskPath + ')' : element;
					currentPath = currentPath.replace(/\/\//g, '/');
					html +=
						'<a class="filescan-nav-item nowrap ' + (isLevel && !isLast ? 'btlink cut-path' : '') + (isFirst ?
							' present' : '') + '" data-path="' + currentPath + '" title="' + currentPath.replaceAll('//', '/') +
						'">' + menuPath + '</a>' + divider;
				}
			}
			$('.fileScanPath').html(html);
			that.event()
		},

		/**
		 * @description: 讲用逗号拼接的字符串去重原格式返回
		 * @param {string} str  '/sdsf/sdf,/sdsf/sdf'
		 * @return {string}    '/sdsf/sdf,'
		 */
		removeDuplicates: function (str) {
			var arr = str.split(',').filter(function (item) {
				return item.trim() !== '';
			});
			var uniqueArr = [];
			for (var i = 0; i < arr.length; i++) {
				var item = arr[i];
				// 去除最后面的斜杠字符
				if (item.slice(-1) === '/') {
					item = item.slice(0, -1);
				}
				if (uniqueArr.indexOf(item) === -1) {
					uniqueArr.push(item);
				}
			}
			return uniqueArr.join(',');
		},

			editScanBtnStatus:function(type){
				var that = this,
					_btn = $('.ClearScanBtn'),

					topLogo = $('.clear_tools_dialog .ct_left i');

				topLogo.removeClass('t_loading clear_loading logo2')

						_btn.removeClass('btn-success').addClass('btn-default').text('Scanning');

						_btn.removeClass('btn-success').addClass('btn-default').text('Cleaning in progress');

						break;

						_btn.removeClass('btn-success').addClass('btn-default').text('Completed');
						reBtn.removeClass('hide');
						break;
				}
			}
		},
		DAWebSocket: function (config) {
			var _that = this
			/**
			 * @description 渲染
			 * @param config
			 * @return {object}
			 * @constructor
			 */
			function ReaderCommand (config) {
				var that = this;
				this.config = $.extend({ route: '/ws_panel' }, config)
				this.open = config.open;
				this.close = config.close;
				this.message = config.message;
				if (this.config.hasOwnProperty('time')) {
					setTimeout(function () {
						that.close_connect()
					}, this.config.time)
				}
				this.init()
			}
			ReaderCommand.prototype = {
				socket: null, //websocket 连接保持的对象
				socketToken: null,
				timeout: 0, // 连接到期时间，为0代表永久有效
				monitor_interval: 2000,
				error: 0, // 错误次数，用于监听元素内容是否还存在
				retry: 0, // 重试次数
				forceExit: false, // 强制断开连接
				/**
				 * @description 程序初始化
				 */
				init: function () {
					var that = this;
					this.create_websocket_connect(this.config.route, this.config.param)
					// this.monitor_element()
				},
				/**
				 * @description 创建websocket连接
				 * @param {string} url websocket连接地址
				 * @param {string} param 需要传递的参数
				 */
				create_websocket_connect: function (url, param) {
					var that = this;
					this.socket = new WebSocket((location.protocol === 'http:' ? 'ws://' : 'wss://') + location.host + url)
					this.socket.addEventListener('open', function (ev) {
						if (!this.socketToken) {
							var _token = document.getElementById('request_token_head').getAttribute('token');
							this.socketToken = { 'x-http-token': _token }
						}
						this.send(JSON.stringify(this.socketToken))
						this.send(JSON.stringify(param))
						if (that.open) that.open()
						that.retry = 0
					});
					this.socket.addEventListener('close', function (ev) {
						if (!that.forceExit) {
							// console.log(ev.code,that.retry)
							if (ev.code !== 1000 && that.retry <= 10) {
								that.socket = that.create_websocket_connect(that.config.route, that.config.param)
								that.retry++;
							}
							if (that.close) that.close(ev)
						}
					});
					this.socket.addEventListener('message', function (ws_event) {
						var result = ws_event.data
						if (!result) return;
						if (that.message) that.message(JSON.parse(result))
					})
					return this.socket
				},

				/**
				 * @description 监听元素状态，判断是否移除当前的ws连接
				 *
				 */
				monitor_element: function () {
					var that = this;
					this.monitor_interval = setInterval(function () {
						if (!that.el.length) {
							that.close_connect()
							clearInterval(that.monitor_interval)
						}
					}, that.config.monitorTime || 2000)
				},

				/**
				 * @description 断开命令响应和websocket连接
				 */
				close_connect: function () {
					this.forceExit = true
					this.socket.close()
				}
			}
			return new ReaderCommand(config)
		},
	};
